<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiTurnoSalud — Recuperar contraseña</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f6f8fa;padding:2rem}
    .box{max-width:480px;margin:1.5rem auto;background:#fff;padding:1rem;border-radius:8px}
    input,button{width:100%;padding:.6rem;margin-top:.5rem;border:1px solid #ddd;border-radius:6px}
  </style>
</head>
<body>
  <section class="box">
    <header><img src="assets/img/logo.svg" alt="Logo" style="height:40px"/><h2>Recuperar contraseña</h2></header>
    <p>Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.</p>
    <form action="#" method="post">
      <label>Correo electrónico</label>
      <input type="email" name="email" required />
      <button type="submit">Enviar instrucciones</button>
    </form>
    <p style="margin-top:.6rem"><a href="index.html">Volver al inicio</a></p>
  </section>
</body>
</html>
