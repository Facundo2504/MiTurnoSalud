<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña - MiTurnoSalud</title></head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__brand"><a href="index.html" class="brand__name">MiTurnoSalud</a></div>
  </header>

  <main class="container">
    <h1>Recuperar Contraseña</h1>
    <p class="muted">Introduce tu correo electrónico para restablecer la contraseña</p>

    <form class="form" action="#" method="post" novalidate>
      <div class="form__group">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required>
      </div>
      <button type="submit" class="btn btn--primary">Enviar</button>
      <p class="form__help">¿Ya tienes una cuenta? <a href="index.html">Iniciar sesión</a></p>
    </form>
  </main>
</body>
</html>
