<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiTurnoSalud — Panel</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;margin:0}
    header{display:flex;align-items:center;gap:1rem;padding:1rem;background:#fff;border-bottom:1px solid #eee}

<body>
  <header>

    <h1 style="font-size:1rem;margin:0">MiTurnoSalud</h1>
  </header>

  <div class="wrap">
    <nav>
      <a class="button" href="agendar-especialidad.html">Agendar por especialidad</a>
      <a class="button" href="agendar-medico.html">Agendar por médico</a>
      <a class="button" href="agendar-institucion.html">Agendar por institución</a>
      <a class="button" href="confirmar-turno.html">Confirmar turno</a>
    </nav>

    <main>
      <section style="background:#fff;padding:1rem;border-radius:8px">
        <h2>Próximos turnos</h2>
        <p>Aquí aparecerán tus turnos agendados.</p>
        <!-- Listado de turnos -> generar dinámicamente -->
      </section>
    </main>
  </div>

</html>
