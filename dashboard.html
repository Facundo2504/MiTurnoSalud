<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Panel principal de MiTurnoSalud: gestiona tus turnos médicos fácilmente.">
  <title>Inicio - MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="dashboard.html" class="brand__link">
        <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
        <span class="brand__name">MiTurnoSalud</span>
      </a>
    </div>

    <nav class="site-header__actions" aria-label="Acciones">
      <a href="dashboard.html" class="btn btn--ghost">Inicio</a>
      <a href="perfil.html" class="btn btn--primary">Perfil</a>
      <button id="btnTheme" type="button" class="btn btn--ghost" aria-pressed="false">🌞 Día</button>
      <button id="btnLogout" type="button" class="btn btn--primary">Cerrar sesión</button>
    </nav>
  </header>


  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Navegación secundaria">
      <nav role="navigation">
        <ul role="list">
          <li class="nav__item nav__item--active">
            <button class="nav__link" aria-current="page" aria-expanded="true">Turnos</button>
            <ul role="list" class="nav__sublist">
              <li><a href="dashboard.html" aria-current="page">Historial Turnos</a></li>
              <li><a href="agendar-especialidad.html">Agendar Turno</a></li>
            </ul>
          </li>
          <!-- Aquí cambiamos los enlaces -->
          <li><a href="perfil.html">Perfil</a></li>
          <li><a href="notificaciones.html">Notificaciones</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main -->
    <main class="content">
      <h1>Bienvenido/a</h1>

      <section aria-labelledby="proximos-turnos">
        <h2 id="proximos-turnos">Próximos turnos</h2>

        <!-- Contenedor dinámico -->
        <div class="cards" aria-live="polite">
          <!-- El script dashboard.js insertará los turnos aquí -->
        </div>

        <!-- Botón de recordatorio -->
        <div class="actions">
          <button class="btn btn--primary" type="button" id="btnRecordatorio">
            Enviar recordatorio
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
