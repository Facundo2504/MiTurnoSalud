<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro - MiTurnoSalud</title></head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
      <a href="index.html" class="brand__name">MiTurnoSalud</a>
    </div>
  </header>

  <main class="container">
    <h1>Registrarse</h1>
    <p class="muted">Registro de paciente</p>

    <form class="form" action="#" method="post" novalidate>
      <div class="form__row">
        <div class="form__group">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" required>
        </div>
        <div class="form__group">
          <label for="apellido">Apellido</label>
          <input id="apellido" name="apellido" type="text" required>
        </div>
      </div>

      <div class="form__group">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="form__row">
        <div class="form__group">
          <label for="obraSocial">Obra social</label>
          <input id="obraSocial" name="obraSocial" type="text" list="obras">
          <datalist id="obras">
            <option value="OSDE"></option>
            <option value="Swiss Medical"></option>
            <option value="Galeno"></option>
          </datalist>
        </div>
        <div class="form__group">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" inputmode="tel" placeholder="Ej: 3493-416732">
        </div>
      </div>

      <button class="btn btn--primary" type="submit">Registrarse</button>
      <p class="form__help"><a href="recuperar.html">¿Olvidaste tu Contraseña?</a></p>
    </form>
  </main>
</body>
</html>
