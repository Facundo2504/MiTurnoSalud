<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Regístrate en MiTurnoSalud para gestionar tus turnos médicos fácilmente.">
  <title>Registro - MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="index.html" class="brand__link">
        <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
        <span class="brand__name">MiTurnoSalud</span>
      </a>
    </div>
  </header>

  <main class="container">
    <h1>Registrarse</h1>
    <p class="muted">Registro de paciente</p>

    <form id="formRegistro" class="form" novalidate>
      <div class="form__row">
        <div class="form__group">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" required autocomplete="given-name">
        </div>
        <div class="form__group">
          <label for="apellido">Apellido</label>
          <input id="apellido" name="apellido" type="text" required autocomplete="family-name">
        </div>
      </div>

      <div class="form__group">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               placeholder="tu@correo.com">
      </div>

      <div class="form__row">
        <div class="form__group">
          <label for="obraSocial">Obra social</label>
          <input id="obraSocial" name="obraSocial" type="text" list="obras" autocomplete="organization">
          <datalist id="obras">
            <option value="OSDE">
            <option value="Swiss Medical">
            <option value="Galeno">
            <option value="Medifé">
            <option value="Omint">
            <option value="Sancor Salud">
            <option value="PAMI">
            <option value="Otra">
            

          </datalist>
        </div>

        <div class="form__group">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" inputmode="tel"
                 pattern="[0-9+\-() ]{6,}" placeholder="Ej: 3493-416732">
        </div>
      </div>

      <div class="form__group">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required minlength="8"
               autocomplete="new-password" placeholder="Mínimo 8 caracteres">
      </div>

      <button class="btn btn--primary" type="submit">Registrarse</button>

      <p class="form__help">
        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
      </p>
    </form>
  </main>

  <script src="js/registro.js" defer></script>
</body>
</html>
