<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Contraseña restablecida - MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg, #0b1220);
      color: var(--text, #fff);
      font-family: system-ui, sans-serif;
      margin: 0;
      text-align: center;
    }
    .card {
      background: var(--panel, #111827);
      border: 1px solid var(--border, #334155);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      max-width: 400px;
      width: 90%;
      animation: pop .4s ease-out;
    }
    .card h1 {
      color: var(--text-strong, #fff);
      margin-bottom: 8px;
    }
    .card p { color: var(--muted, #94a3b8); margin-bottom: 16px; }
    .btn {
      background: var(--primary, #2563eb);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: var(--primary-2, #1d4ed8); }
    @keyframes pop {
      from { transform: scale(.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card" role="alert" aria-live="assertive">
    <h1>✅ ¡Contraseña actualizada!</h1>
    <p>Tu contraseña fue restablecida correctamente.<br>Ahora podés iniciar sesión con tu nueva clave.</p>
    <button class="btn" onclick="window.location.href='index.html'">
      Ir al inicio de sesión
    </button>
  </div>
</body>
</html>
