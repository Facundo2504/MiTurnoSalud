<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Perfil del usuario | MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="perfil.css" />
</head>

<body>
  <a class="skip" href="#main">Saltar al contenido principal</a>

  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="dashboard.html" class="brand__link">
        <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
        <span class="brand__name">MiTurnoSalud</span>
      </a>
    </div>

    <nav class="site-header__actions" aria-label="Acciones">
      <a href="dashboard.html" class="btn btn--ghost">Inicio</a>
      <a href="perfil.html" class="btn btn--primary">Perfil</a>
      <button id="btnTheme" type="button" class="btn btn--ghost" aria-pressed="false">🌞 Día</button>
      <button id="btnLogout" type="button" class="btn btn--primary">Cerrar sesión</button>
    </nav>
  </header>


  <main id="main" class="wrap perfil" tabindex="-1">
    <aside class="perfil__nav" aria-label="Opciones de perfil">
      <ul role="tablist">
        <li><button id="tab-general" role="tab" aria-controls="view" aria-selected="true" data-route="/general">General</button></li>
        <li><button id="tab-seguridad" role="tab" aria-controls="view" aria-selected="false" data-route="/seguridad">Seguridad</button></li>
        <li><button id="tab-notificaciones" role="tab" aria-controls="view" aria-selected="false" data-route="/notificaciones">Notificaciones</button></li>
        <li><button id="tab-privacidad" role="tab" aria-controls="view" aria-selected="false" data-route="/privacidad">Privacidad</button></li>
      </ul>
    </aside>

    <section id="view" class="perfil__view" aria-live="polite">
      <p class="hint">Cargando…</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/perfil.js" defer></script>
</body>
</html>
