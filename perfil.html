<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Perfil — MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link rel="stylesheet" href="perfil.css" />
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="topbar" role="banner">
    <div class="brand">
      <img src="assets/img/logo.svg" alt="" aria-hidden="true" width="28" height="28" />
      <strong>MiTurnoSalud</strong>
    </div>

    <nav aria-label="Principal" class="topbar__nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="perfil.html" aria-current="page">Perfil</a>
      <a href="notificaciones.html">Notificaciones</a>

      <button id="btnTheme" class="btn btn--ghost" type="button" aria-pressed="false" title="Cambiar tema">🌞/🌙</button>
      <button id="btnLogout" class="btn btn--ghost" type="button">Cerrar sesión</button>
    </nav>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <h1>Tu perfil</h1>

    <!-- Tabs (router por hash) -->
    <div class="tabs" role="tablist" aria-label="Secciones de perfil">
      <a role="tab" id="tab-general"      href="#/general"      aria-selected="true">General</a>
      <a role="tab" id="tab-seguridad"    href="#/seguridad"    aria-selected="false" tabindex="-1">Seguridad</a>
      <a role="tab" id="tab-notificaciones" href="#/notificaciones" aria-selected="false" tabindex="-1">Notificaciones</a>
      <a role="tab" id="tab-privacidad"   href="#/privacidad"   aria-selected="false" tabindex="-1">Privacidad</a>
    </div>

    <!-- Contenedor donde se cargan las vistas -->
    <section id="view" class="card view" aria-live="polite" aria-busy="false"></section>

    <div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
  </main>

  <script src="perfil.js" defer></script>
</body>
</html>
