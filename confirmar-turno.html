<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Confirmar turno</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link rel="stylesheet" href="styles.css">
 <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f6f8fa;padding:1rem}
    .card{max-width:540px;margin:auto;background:#fff;padding:1rem;border-radius:8px;text-align:left}
    .summary{background:#fbfbff;border:1px solid #eef;margin-top:.6rem;padding:.8rem;border-radius:6px}
    button{margin-top:.8rem;padding:.7rem;width:100%;border-radius:6px;background:#28a745;color:#fff;border:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Confirmar turno</h2>
    <p>Revisa los datos antes de confirmar.</p>

    <div class="summary">
      <p><strong>Médico:</strong> Dra. Ana Pérez</p>
      <p><strong>Especialidad:</strong> Cardiología</p>
      <p><strong>Institución:</strong> Clínica San José</p>
      <p><strong>Fecha y hora:</strong> 2025-10-15 — 10:30</p>
    </div>

    <form action="#" method="post">
      <label>Observaciones (opcional)</label>
      <input name="notes" type="text" placeholder="Ej: preferir turno por la tarde" />
      <button type="submit">Confirmar turno</button>
    </form>
  </div>
</body>
</html>
