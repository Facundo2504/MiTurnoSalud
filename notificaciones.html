<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Notificaciones — MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="dashboard.html" class="brand__link">
        <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
        <span class="brand__name">MiTurnoSalud</span>
      </a>
    </div>
    <nav aria-label="Principal">
      <a href="dashboard.html">Inicio</a>
      <a href="perfil.html">Perfil</a>
      <a href="notificaciones.html" aria-current="page">Notificaciones</a>
      <button id="btnLogout" class="btn btn--ghost">Cerrar sesión</button>
    </nav>
  </header>

  <main id="main" class="container" tabindex="-1">
    <h1>Notificaciones</h1>
    <p class="muted">Configurá tus preferencias y probá envíos de ejemplo.</p>

    <!-- Preferencias -->
    <section class="panel">
      <h2>Preferencias de envío</h2>
      <form id="form-notif" class="form" novalidate>
        <div class="grid grid--3">
          <div class="form__group">
            <label for="channel"><strong>Canal preferido</strong></label>
            <select id="channel" name="channel">
              <option value="email">Email</option>
              <option value="sms">SMS</option>
              <option value="whatsapp">WhatsApp</option>
            </select>
          </div>

          <div class="form__group">
            <label for="hoursBefore"><strong>Horas antes del turno</strong></label>
            <input id="hoursBefore" name="hoursBefore" type="number" min="1" max="168" value="24" />
            <p class="hint">Entre 1 y 168 (una semana).</p>
          </div>

          <div class="form__group">
            <label for="lang"><strong>Idioma</strong></label>
            <select id="lang" name="lang">
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="form__group">
            <label for="quietFrom"><strong>Silencio desde</strong></label>
            <input id="quietFrom" name="quietFrom" type="time" value="22:00" />
          </div>

          <div class="form__group">
            <label for="quietTo"><strong>Silencio hasta</strong></label>
            <input id="quietTo" name="quietTo" type="time" value="07:00" />
          </div>

          <div class="form__group">
            <label for="testDest"><strong>Destino de prueba</strong></label>
            <input id="testDest" name="testDest" type="text" placeholder="tu@correo.com / +549..." />
          </div>
        </div>

        <div class="actions">
          <button type="button" id="btnTest" class="btn">Probar envío (mock)</button>
          <button type="submit" class="btn btn--primary">Guardar preferencias</button>
        </div>
      </form>
    </section>

    <!-- Historial -->
    <section class="panel">
      <h2>Historial de envíos simulados</h2>
      <p class="hint">Los envíos de prueba se almacenan localmente.</p>
      <div id="history"></div>
      <div class="actions">
        <button id="btnClear" class="btn btn--danger" type="button">Limpiar historial</button>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite" class="toast"></div>
  </main>

  <script src="js/notifications.js" defer></script>
</body>
</html>
