<section class="perfil-section perfil-notificaciones">
  <h1>Preferencias de notificaciones</h1>
  <p class="muted">Elegí cómo y cuándo querés recibir recordatorios de tus turnos.</p>

  <form id="formNotifPerfil" class="form" novalidate>
    <div class="grid grid--3">
      <div class="form__group">
        <label for="channel"><strong>Canal preferido</strong></label>
        <select id="channel" name="channel">
          <option value="email">Email</option>
          <option value="sms">SMS</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </div>

      <div class="form__group">
        <label for="hoursBefore"><strong>Horas antes del turno</strong></label>
        <input id="hoursBefore" name="hoursBefore" type="number" min="1" max="168" />
        <p class="hint">Entre 1 y 168 (una semana).</p>
      </div>

      <div class="form__group">
        <label for="lang"><strong>Idioma</strong></label>
        <select id="lang" name="lang">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="form__group">
        <label for="quietFrom"><strong>Silencio desde</strong></label>
        <input id="quietFrom" name="quietFrom" type="time" />
      </div>

      <div class="form__group">
        <label for="quietTo"><strong>Silencio hasta</strong></label>
        <input id="quietTo" name="quietTo" type="time" />
      </div>

      <div class="form__group">
        <label for="testDest"><strong>Destino de prueba</strong></label>
        <input id="testDest" name="testDest" type="text" placeholder="tu@correo.com / +549..." />
      </div>
    </div>

    <div class="actions">
      <button type="button" id="btnTestNotif" class="btn">Probar envío (mock)</button>
      <button type="submit" class="btn btn--primary">Guardar preferencias</button>
    </div>

    <p id="msgNotifPerfil" class="form__feedback" aria-live="polite"></p>
  </form>

  <hr class="sep" aria-hidden="true" />

  <section>
    <h2>Historial de notificaciones simuladas</h2>
    <p class="hint">Los envíos de prueba se guardan localmente en este navegador.</p>
    <div id="notifHistory"></div>
    <div class="actions">
      <button id="btnClearNotif" class="btn btn--danger" type="button">Limpiar historial</button>
    </div>
  </section>
</section>
