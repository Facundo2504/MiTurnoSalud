<section class="perfil-section perfil-general">
  <h1>Datos personales</h1>
  <p class="muted">Actualizá tu información personal básica.</p>

  <form id="formGeneral" class="form" novalidate>
    <div class="form__group">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text" required placeholder="Ej. Juan Pérez" />
    </div>

    <div class="form__group">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required placeholder="Ej. juan@mail.com" />
    </div>

    <div class="form__group">
      <label for="telefono">Teléfono</label>
      <input id="telefono" name="telefono" type="tel" placeholder="+54 9 11 1234 5678" />
    </div>

    <div class="form__group">
      <label for="zona">Zona horaria</label>
      <select id="zona" name="zona">
        <option value="America/Argentina/Buenos_Aires">Argentina (Buenos Aires)</option>
        <option value="America/Santiago">Chile (Santiago)</option>
        <option value="America/Bogota">Colombia (Bogotá)</option>
        <option value="America/Lima">Perú (Lima)</option>
        <option value="America/Mexico_City">México (CDMX)</option>
        <option value="UTC">UTC</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn--primary">Guardar cambios</button>
      <button type="reset" class="btn btn--ghost">Restablecer</button>
    </div>

    <p id="msgGeneral" class="form__feedback" aria-live="polite"></p>
  </form>
</section>
