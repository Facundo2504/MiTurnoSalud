<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agendar turno - Selección de médico | MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="dashboard.html" class="brand__link">
        <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
        <span class="brand__name">MiTurnoSalud</span>
      </a>
    </div>

    <nav class="site-header__actions" aria-label="Acciones">
      <a href="dashboard.html" class="btn btn--ghost">Inicio</a>
      <a href="perfil.html" class="btn btn--primary">Perfil</a>
      <button id="btnTheme" type="button" class="btn btn--ghost" aria-pressed="false">🌞 Día</button>
      <button id="btnLogout" type="button" class="btn btn--primary">Cerrar sesión</button>
    </nav>
  </header>


  <main class="container">
    <h1>Agendar turno</h1>

   <!-- MISMO BLOQUE EN agendar-especialidad.html, agendar-medico.html, agendar-fecha-hora.html y agendar-institucion.html -->
  <div class="stepper" aria-label="Progreso de agendamiento">
    <ol class="stepper__list">
      <li class="stepper__item STEP1"><span>Paso 1 · Especialidad</span></li>
      <li class="stepper__item STEP2"><span>Paso 2 · Médico</span></li>
      <li class="stepper__item STEP3"><span>Paso 3 · Fecha y hora</span></li>
      <li class="stepper__item STEP4"><span>Paso 4 · Institución</span></li>
    </ol>
  </div>


    <section class="panel">
      <h2>Seleccioná un profesional</h2>
      <p class="muted" id="especialidadSeleccionada"></p>

      <form id="formMedico" class="form" novalidate>
        <div id="listaMedicos" class="cards"></div>
        <p class="form__feedback" aria-live="polite"></p>
        <div class="actions">
          <a href="agendar-especialidad.html" class="btn btn--ghost">← Volver</a>
          <button type="submit" class="btn btn--primary">Continuar →</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    // Mock mínimo de seguridad y datos
    const Auth = {
      requireAuth() {
        const session = JSON.parse(localStorage.getItem("mts.session") || "null");
        if (!session) {
          const login = new URL("index.html", location.origin);
          login.searchParams.set("next", "agendar-medico.html");
          location.href = login.toString();
        }
      }
    };

    const MTS = {
      Data() {
        return {
          medicos: {
            "Cardiología": [
              { nombre: "Dra. Pérez", centro: "Clínica San Martín" },
              { nombre: "Dr. López", centro: "Hospital Central" }
            ],
            "Pediatría": [
              { nombre: "Dra. Castro", centro: "Hospital de Niños" },
              { nombre: "Dr. Molina", centro: "Centro Médico Sur" }
            ],
            "Dermatología": [
              { nombre: "Dra. Rivas", centro: "Clínica Dermaskin" },
              { nombre: "Dr. Quintana", centro: "Hospital Belgrano" }
            ],
            "Traumatología": [
              { nombre: "Dr. Giménez", centro: "Centro Ortopédico Norte" },
              { nombre: "Dra. Vega", centro: "Clínica del Oeste" }
            ]
          }
        };
      },
      Draft: {
        get() {
          return JSON.parse(localStorage.getItem("mts.draft") || "{}");
        },
        set(obj) {
          localStorage.setItem("mts.draft", JSON.stringify(obj));
        }
      }
    };
  </script>

  <script src="js/agendar-medico.js" defer></script>
</body>
</html>
