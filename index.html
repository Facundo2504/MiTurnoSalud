<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Inicia sesión en MiTurnoSalud para gestionar tus turnos médicos fácilmente.">
  <title>Iniciar sesión - MiTurnoSalud</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header unificado -->
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="index.html" class="brand__link">
        <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
        <span class="brand__name">MiTurnoSalud</span>
      </a>
    </div>
  </header>

  <main class="container">
    <h1>Iniciar Sesión</h1>

    <form id="loginForm" class="form" action="#" method="post" autocomplete="on" novalidate>
      <div class="form__group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          spellcheck="false"
          placeholder="tu@correo.com">
      </div>

      <div class="form__group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          autocomplete="current-password"
          placeholder="********">
      </div>

      <!-- Toggle mostrar contraseña -->
      <div class="form__group">
        <label style="display:flex; align-items:center; gap:.5rem;">
          <input id="togglePassword" type="checkbox" aria-controls="password"> Mostrar contraseña
        </label>
      </div>

      <button type="submit" class="btn btn--primary">Iniciar sesión</button>

      <p id="loginFeedback" class="form__help" role="alert" aria-live="polite"></p>

      <p class="form__help">
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </p>

      <p class="form__help">
        ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
      </p>
    </form>
  </main>

  <noscript>
    <p class="form__help" style="color: var(--danger); text-align:center">
      Necesitas habilitar JavaScript para iniciar sesión.
    </p>
  </noscript>

  <!-- Scripts: solo lo necesario -->
  <script>
    // Mostrar/ocultar contraseña (no interfiere con login.js)
    document.addEventListener('DOMContentLoaded', () => {
      const chk = document.getElementById('togglePassword');
      const pass = document.getElementById('password');
      chk?.addEventListener('change', () => {
        pass.type = chk.checked ? 'text' : 'password';
      });
    });
  </script>
  <script src="js/login.js" defer></script>
</body>
</html>
