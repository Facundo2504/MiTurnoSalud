<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiTurnoSalud — Login</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <style>
    /* Estilos mínimos para preview rápido */
    body { font-family: Arial, sans-serif; margin: 0; padding: 2rem; background:#f6f8fa; color:#111; }
    .container { max-width:420px; margin: 2rem auto; background:#fff; padding:1.5rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
    header img { height:48px; }
    form input, form button { width:100%; padding:.75rem; margin-top:.5rem; border:1px solid #ddd; border-radius:6px; }
    .actions { display:flex; gap:.5rem; margin-top:.75rem; }
    .actions a { font-size:.9rem; color:#0366d6; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="assets/img/logo.svg" alt="MiTurnoSalud logo" />
      <h1>Iniciar sesión</h1>
    </header>

    <form id="loginForm" action="#" method="post" novalidate>
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="tu@ejemplo.com" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required />

      <button type="submit">Entrar</button>

      <div class="actions">
        <a href="registro.html">Registrarse</a>
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</body>
</html>
