<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>Iniciar sesión - MiTurnoSalud</title>
</head>
<body>
  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <img src="assets/img/logo.svg" alt="" aria-hidden="true" class="brand__logo">
      <span class="brand__name">MiTurnoSalud</span>
    </div>
  </header>

  <main class="container">
    <h1>Iniciar Sesión</h1>

    <form class="form" action="#" method="post" autocomplete="on" novalidate>
      <div class="form__group">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required inputmode="email" placeholder="tu@correo.com">
      </div>

      <div class="form__group">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required minlength="8" placeholder="********">
      </div>

      <button type="submit" class="btn btn--primary">Iniciar sesión</button>
      <p class="form__help">
        <a href="recuperar.html">¿Olvidaste tu Contraseña?</a>
      </p>
    </form>

    <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </main>
</body>
</html>
